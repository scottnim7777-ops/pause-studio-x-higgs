<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#D9D6D1;font-family:Pretendard,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 40%,#E6E3DE,#C9C5BF)}
.win{position:absolute;left:160px;top:70px;width:1600px;border-radius:14px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.08);background:#fff}
.bar{height:46px;background:#F3F2F0;display:flex;align-items:center;padding:0 18px;gap:8px;border-bottom:1px solid #E2E0DC}
.bar i{width:12px;height:12px;border-radius:50%;background:#E0DED9}.url{margin-left:180px;width:520px;height:28px;border-radius:8px;background:#E6E4E0;font:500 14px/28px Pretendard;color:#666;text-align:center}
.sc{height:854px;background:url(src/r_blessings.png) center/cover}
.cap{position:absolute;left:164px;bottom:46px;font:600 22px/1 Pretendard;color:#2B2A28;letter-spacing:.02em}.cap span{font-weight:400;color:#6B6862;margin-left:12px}
</style></head><body><div class="bg"></div><div class="win"><div class="bar"><i></i><i></i><i></i><span class="url"></span></div><div class="sc"></div></div></body></html>
