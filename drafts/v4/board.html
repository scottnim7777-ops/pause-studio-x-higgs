</style></head><body><h1>PAUSE STUDIO — 4차: 영상 들어가기 전 콘티 스틸</h1>
<p class="l">공간은 Higgsfield 사진(화면만 초록) · 화면 속은 실제 제작 사이트를 원근에 맞춰 합성 · 시계 다이얼 삭제, 로고 크게, 제목은 한글 명조 3안<br>컷 5(19~24초)는 컷 1과 같은 책상의 밤→새벽빛으로 돌아와 끊김 없이 반복 · 영상은 이 느낌을 확인하신 뒤에만 만듭니다</p>
<h2>첫 화면 — 제목 서체 3안</h2><div class="g3"><figure><img src="composites/hero-A_1920x1080.png"><figcaption><b>A</b> SD 격동명조2 <span>힘 있는 제목, 영화 포스터 느낌</span></figcaption></figure><figure><img src="composites/hero-B_1920x1080.png"><figcaption><b>B</b> SD 정체 <span>붓맛이 살아 있는 문학적 명조</span></figcaption></figure><figure><img src="composites/hero-C_1920x1080.png"><figcaption><b>C</b> AG 최정호 <span>단정하고 고급스러운 정통 명조</span></figcaption></figure></div><h2>콘티 (24초 반복)</h2><div class="g4"><figure><img src="shots/shot1-studio_kvibe.jpg"><figcaption><b>컷 1</b> 0~5초 · 스튜디오 책상 · 아침빛 → 한낮 <span>화면: K-VIBE(실제 영상 사이트)</span></figcaption></figure><figure><img src="shots/shot2-macro_dongdaemun.jpg"><figcaption><b>컷 2</b> 5~9초 · 모니터 매크로 · 초점이 글자에서 사진으로 <span>화면: 동대문 한식당</span></figcaption></figure><figure><img src="shots/shot3-cafe_blooming.jpg"><figcaption><b>컷 3</b> 9~14초 · 카페 카운터 휴대폰 · 저녁빛 <span>화면: Blooming 케이크</span></figcaption></figure><figure><img src="shots/shot4-reception_blessings.jpg"><figcaption><b>컷 4</b> 14~19초 · 리셉션 데스크 노트북 · 밤 <span>화면: Global Blessings 호스피스</span></figcaption></figure></div></body></html>
