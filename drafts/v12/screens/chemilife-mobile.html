<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:390px;height:844px;overflow:hidden}
body{-webkit-font-smoothing:antialiased;position:relative;font-family:Pretendard,sans-serif;background:#F6F3EE;color:#2A2622;word-break:keep-all}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 16px/1 Pretendard;z-index:20}
.sb .ic{display:flex;gap:6px;align-items:center}.sb svg{fill:currentColor}
header{position:absolute;top:50px;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #E7E1D8}
header img{height:38px}.burger{width:22px;display:grid;gap:5px}.burger i{height:1.6px;background:#2A2622;display:block}
.cart{position:relative;width:24px;height:22px}.cart svg{stroke:#2A2622}.cart b{position:absolute;right:-7px;top:-6px;width:16px;height:16px;border-radius:50%;background:#C69A3C;color:#fff;font:700 10px/16px Pretendard;text-align:center}
.ban{position:absolute;top:122px;left:14px;right:14px;height:300px;border-radius:16px;overflow:hidden;background:#EFECE7}
.ban .im{position:absolute;right:-34px;bottom:-6px;width:300px}
.ban .tx{position:absolute;left:16px;top:18px;width:250px}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px}.dots i{width:6px;height:6px;border-radius:3px;background:rgba(42,38,34,.25)}.dots i:first-child{width:18px;background:#2A2622}
.sec{position:absolute;top:440px;left:18px;right:18px}.sec small{font:600 11px/1 Pretendard;letter-spacing:.22em;color:#8C8378}.sec h3{font:700 22px/1.2 'Noto Serif KR';margin-top:8px}
.chips{display:flex;gap:6px;margin-top:12px;overflow:hidden;white-space:nowrap}.chips span{font:500 12px/1 Pretendard;padding:8px 11px;border:1px solid #E1DACF;background:#fff}.chips span:first-child{background:#2A2622;color:#fff;border-color:#2A2622}
.grid{position:absolute;top:540px;left:18px;right:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:12px;padding:8px 8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.card p{font:500 12px/1.35 Pretendard;margin-top:8px;height:32px;overflow:hidden}.card b{display:block;font:700 15px/1 Pretendard;margin-top:6px}
.buy{position:absolute;left:0;right:0;bottom:0;height:92px;background:#fff;border-top:1px solid #E7E1D8;padding:12px 16px;display:flex;gap:10px}
.buy a{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 16px/1 Pretendard}.buy .c{width:110px;border:1px solid #D9D1C5}.buy .o{flex:1;background:#2A2622;color:#F6F3EE}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111;z-index:30}
</style></head><body>

<div class="card"><img src="src/cl_p1.png" alt=""><p>내추럴엔젯 프리미엄 마린콜라겐(피부 건강) 60 베지캡슐</p><b>₩86,000</b></div></div>
<div class="buy"><a class="c">장바구니 3</a><a class="o">바로 주문하기</a></div><div class="home"></div>
</body></html>
