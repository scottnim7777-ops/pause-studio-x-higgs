<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>

</style></head><body><h1>PAUSE STUDIO 첫 화면 영상 — 콘티 (약 25초, 무한 반복)</h1>
<p class="s">관리비에 지친 밤 → PAUSE의 렌즈로 사진 한 장이 광고 필름이 됨 → 새 쇼핑몰, 관리비 $0 → 실제 고객의 세계와 웹사이트 → 로고</p>
<p class="s2">로고의 초점·렌즈 효과는 "제품 촬영" 순간에 등장 · 실제 고객 파트는 업체의 세계(사람 얼굴 없음) → 실제 웹사이트로 바로 컷 · SOOM은 가상 브랜드</p>
<h2>고통 — 밤</h2><div class="g"><figure><div class="ph"><img src="shots/00-logo.jpg"><span class="n">1</span></div><figcaption><b>0:00</b> 로고(마지막 프레임과 같음) → 밤 장면으로 디졸브<em>정적 · 무한 반복의 이음매</em></figcaption></figure><figure><div class="ph"><img src="shots/01-night-shoulder.jpg"><span class="n">2</span></div><figcaption><b>0:01</b> SOOM 대표 어깨 너머, 낡은 쇼핑몰과 쌓인 재고<em>핸드헬드로 아주 느리게 다가감</em></figcaption></figure><figure><div class="ph"><img src="shots/02-night-phone.jpg"><span class="n">3</span></div><figcaption><b>0:03</b> 식탁 위 휴대폰: 주문 0건 · 초기 세팅비 $450 · 유지보수비 $50 · 관리비 $100 · 호스팅 $70<em>위에서 고정 · 알림이 하나씩 튀어 오름</em></figcaption></figure><figure><div class="ph"><img src="shots/t-pause.jpg"><span class="n">4</span></div><figcaption><b>0:06</b> 그 화면이 "일시정지" — 색이 빠짐<em>PAUSE 전환</em></figcaption></figure></div><h2>제품 촬영 — PAUSE의 렌즈</h2><div class="g"><figure><div class="ph"><img src="shots/04-before.jpg"><span class="n">5</span></div><figcaption><b>0:06.8</b> 대표가 휴대폰으로 찍은 평범한 제품 사진<em>고정</em></figcaption></figure><figure><div class="ph"><img src="shots/lens-1.jpg"><span class="n">6</span></div><figcaption><b>0:07.6</b> 사진이 흐려지고 PAUSE의 두 원이 렌즈 조리개처럼 맺힘<em>초점이 나감 · 카메라 뷰파인더 느낌</em></figcaption></figure><figure><div class="ph"><img src="shots/lens-2.jpg"><span class="n">7</span></div><figcaption><b>0:08.3</b> 초점이 맞는 순간, 원 안에 광고 필름이 선명하게<em>포커스 당기기 · 원이 화면 밖으로 열림</em></figcaption></figure><figure><div class="ph"><img src="shots/film-water.jpg"><span class="n">8</span></div><figcaption><b>0:09</b> AI 홍보영상 ① 맑은 물가<em>2.39:1 영화 비율 · 느린 밀기</em></figcaption></figure><figure><div class="ph"><img src="shots/film-silk.jpg"><span class="n">9</span></div><figcaption><b>0:10</b> ② 세럼 물결<em>느린 평행 이동</em></figcaption></figure><figure><div class="ph"><img src="shots/film-end.jpg"><span class="n">10</span></div><figcaption><b>0:11</b> ③ "Skin that breathes."<em>그림자만 움직임</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-soom.jpg"><span class="n">11</span></div><figcaption><b>0:12</b> 새 쇼핑몰, 첫 화면에서 그 영상이 재생<em>검은 띠가 열림 · 스크롤</em></figcaption></figure><figure><div class="ph"><img src="shots/07-morning-phone.jpg"><span class="n">12</span></div><figcaption><b>0:14</b> 같은 자리의 아침: 새 주문 + "관리비 · 유지보수 · 호스팅 $0"<em>밤 장면과 같은 구도 매치컷</em></figcaption></figure></div><h2>실제 고객 — 그 업체의 세계 → 그 업체의 웹사이트</h2><div class="g"><figure><div class="ph"><img src="shots/br-kvibe.jpg"><span class="n">13</span></div><figcaption><b>0:16.5</b> 오클랜드 하버 항공<em>같은 방향 패닝으로</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-kvibe.jpg"><span class="n">14</span></div><figcaption><b>0:17.2</b> → K-VIBE (도시 항공 영상 히어로와 매치컷)</figcaption></figure><figure><div class="ph"><img src="shots/br-blooming.jpg"><span class="n">15</span></div><figcaption><b>0:17.9</b> Blooming 케이크, 밝은 주방<em>회전대가 천천히 돎</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-blooming.jpg"><span class="n">16</span></div><figcaption><b>0:18.6</b> → Blooming Cake</figcaption></figure><figure><div class="ph"><img src="shots/br-blessings.jpg"><span class="n">17</span></div><figcaption><b>0:19.3</b> 맞잡은 손<em>고정</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-blessings.jpg"><span class="n">18</span></div><figcaption><b>0:19.9</b> → Global Blessings (손 히어로와 매치컷)</figcaption></figure><figure><div class="ph"><img src="shots/br-chemilife.jpg"><span class="n">19</span></div><figcaption><b>0:20.5</b> 마누카 꿀이 떨어짐<em>매크로</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-chemilife.jpg"><span class="n">20</span></div><figcaption><b>0:21</b> → Chemilife</figcaption></figure><figure><div class="ph"><img src="shots/br-chillenq.jpg"><span class="n">21</span></div><figcaption><b>0:21.5</b> 새벽 야적장의 냉장 트레일러들<em>낮은 앵글 달리</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-chillenq.jpg"><span class="n">22</span></div><figcaption><b>0:22</b> → ChillenQ</figcaption></figure><figure><div class="ph"><img src="shots/br-ddm.jpg"><span class="n">23</span></div><figcaption><b>0:22.5</b> 밤의 동대문, 막걸리와 소주<em>핸드헬드</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-ddm.jpg"><span class="n">24</span></div><figcaption><b>0:23</b> → 동대문</figcaption></figure></div><h2>끝 = 처음</h2><div class="g"><figure><div class="ph"><img src="shots/t-end.jpg"><span class="n">25</span></div><figcaption><b>0:23.6</b> 마지막 화면이 멈추며 두 원이 그려짐<em>PAUSE 시그니처</em></figcaption></figure><figure><div class="ph"><img src="shots/00-logo.jpg"><span class="n">26</span></div><figcaption><b>0:24.5</b> 로고 = 첫 프레임 → 끝없이 반복</figcaption></figure></div></body></html>
