<p class="s">후진 쇼핑몰과 관리비에 지친 사장님 → PAUSE가 사진 한 장으로 광고 영상과 새 쇼핑몰을 → 주문은 늘고 유지보수비는 $0 → 실제 고객들 → 로고</p>
<p style="font-size:26px;color:#9d9487">SOOM은 이 영상을 위해 만든 가상의 쇼핑몰입니다(실제 업체 아님).</p>
<h2>고통 — 후진 쇼핑몰, 주문 0건, 쌓이는 관리비</h2><div class="g"><figure class=""><div class="ph"><img src="shots/s01-logo.jpg"><span class="n">1</span></div><figcaption><b>0:00</b> 로고로 시작</figcaption></figure><figure class=""><div class="ph"><img src="shots/s02-open.jpg"><span class="n">2</span></div><figcaption><b>0:01.5</b> 두 원이 렌즈처럼 열리며</figcaption></figure><figure class=""><div class="ph"><img src="shots/s03-pain-site.jpg"><span class="n">3</span></div><figcaption><b>0:02.5</b> 밤, 누가 봐도 후진 쇼핑몰 앞에서 머리를 감싼 사장님</figcaption></figure><figure class="w"><div class="ph"><div class="two"><img src="shots/s04-pain-phone.jpg"><img src="shots/s04b-pain-close.jpg"></div><span class="n">4</span></div><figcaption><b>0:04.5</b> 휴대폰 알림이 쌓임 → 다가가면: 오늘 주문 0건 · 유지보수비 $180 청구 · 호스팅 $320</figcaption></figure></div><h2>해결 — PAUSE STUDIO</h2><div class="g"><figure class=""><div class="ph"><img src="shots/s05-pause.jpg"><span class="n">5</span></div><figcaption><b>0:07</b> 화면이 "일시정지"되듯 멈추고 PAUSE의 두 원이 지나감</figcaption></figure><figure class=""><div class="ph"><img src="shots/s06-before.jpg"><span class="n">6</span></div><figcaption><b>0:08</b> 휴대폰으로 대충 찍은 제품 사진 한 장</figcaption></figure><figure class=""><div class="ph"><img src="shots/s07-promo-splash.jpg"><span class="n">7</span></div><figcaption><b>0:09</b> → AI 홍보영상: 초고속 촬영 물방울</figcaption></figure><figure class=""><div class="ph"><img src="shots/s08-promo-beach.jpg"><span class="n">8</span></div><figcaption><b>0:10.2</b> → 뉴질랜드 해변 노을</figcaption></figure><figure class=""><div class="ph"><img src="shots/s09-new-site.jpg"><span class="n">9</span></div><figcaption><b>0:11.5</b> 아침, 새 쇼핑몰 — 첫 화면에서 그 광고 영상이 재생</figcaption></figure><figure class="w"><div class="ph"><div class="two"><img src="shots/s10-orders-phone.jpg"><img src="shots/s10b-orders-close.jpg"></div><span class="n">10</span></div><figcaption><b>0:13.5</b> 새 주문 알림이 쌓이고 마지막 줄: PAUSE STUDIO · 유지보수비 $0</figcaption></figure></div><h2>실제 고객 웹사이트</h2><div class="g"><figure class=""><div class="ph"><img src="shots/s11-chemilife.jpg"><span class="n">11</span></div><figcaption><b>0:16</b> Chemilife</figcaption></figure><figure class=""><div class="ph"><img src="shots/s12-chillenq.jpg"><span class="n">12</span></div><figcaption><b>0:18</b> ChillenQ</figcaption></figure><figure class=""><div class="ph"><img src="shots/s13-kvibe.jpg"><span class="n">13</span></div><figcaption><b>0:20</b> K-VIBE</figcaption></figure><figure class=""><div class="ph"><img src="shots/s14-dongdaemun.jpg"><span class="n">14</span></div><figcaption><b>0:22</b> 동대문</figcaption></figure></div><h2>반복</h2><div class="g"><figure class=""><div class="ph"><img src="shots/s15-freeze.jpg"><span class="n">15</span></div><figcaption><b>0:24</b> 멈추며 두 원이 그려짐</figcaption></figure><figure class=""><div class="ph"><img src="shots/s01-logo.jpg"><span class="n">16</span></div><figcaption><b>0:25</b> 로고 = 처음 장면 → 끝없이 반복</figcaption></figure></div></body></html>
