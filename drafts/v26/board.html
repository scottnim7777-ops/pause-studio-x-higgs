</style></head><body><h1>PAUSE STUDIO 첫 화면 영상 — 콘티 (약 23초, 무한 반복)</h1>
<p class="s">고통 → 로고가 그려지고 그 두 원이 렌즈가 됨 → 사진 한 장이 광고 영상과 새 쇼핑몰로 → 실제 고객도 같은 방식으로 → 원이 닫히며 로고 → 다시 밤</p>
<h2>밤 — 관리비에 지친 사장님</h2><div class="g"><figure><div class="ph"><img src="shots/01-night-shoulder.jpg"><span class="n">1</span></div><figcaption><b>0:00</b> 어두운 방, 낡은 쇼핑몰 앞의 SOOM 대표(가상 브랜드)</figcaption></figure><figure><div class="ph"><img src="shots/02-night-phone.jpg"><span class="n">2</span></div><figcaption><b>0:02</b> 알림: 주문 0건 · 초기 세팅비 $450 · 유지보수비 $50 · 관리비 $100 · 호스팅 $70</figcaption></figure><figure><div class="ph"><img src="shots/03-pause.jpg"><span class="n">3</span></div><figcaption><b>0:05</b> "일시정지"되듯 멈추고 색이 빠짐</figcaption></figure></div><h2>PAUSE STUDIO — 로고 등장</h2><div class="g"><figure><div class="ph"><img src="shots/04-before.jpg"><span class="n">4</span></div><figcaption><b>0:05.8</b> 대표가 찍은 평범한 제품 사진</figcaption></figure><figure><div class="ph"><img src="shots/L1-draw.jpg"><span class="n">5</span></div><figcaption><b>0:06.3</b> 사진이 어둠으로 가라앉고, 두 원이 맨 위에서 서로 반대 방향으로 그려짐</figcaption></figure><figure><div class="ph"><img src="shots/L2-rings.jpg"><span class="n">6</span></div><figcaption><b>0:06.8</b> 두 원이 완성되는 순간 교차점에 빛이 맺힘</figcaption></figure><figure><div class="ph"><img src="shots/L3-type.jpg"><span class="n">7</span></div><figcaption><b>0:07.2</b> 빛이 지나가며 글자가 왼쪽부터 드러남</figcaption></figure><figure><div class="ph"><img src="shots/L4-logo.jpg"><span class="n">8</span></div><figcaption><b>0:07.6</b> 마지막으로 ® — 로고 완성</figcaption></figure></div><h2>로고 → 촬영 초점 → 광고 영상</h2><div class="g"><figure><div class="ph"><img src="shots/L5-focus-out.jpg"><span class="n">9</span></div><figcaption><b>0:08.3</b> 글자만 사라지고 같은 모양의 두 원 안에 광고 영상(초점 나감)</figcaption></figure><figure><div class="ph"><img src="shots/L6-focus-in.jpg"><span class="n">10</span></div><figcaption><b>0:08.8</b> 초점이 딱 맞음</figcaption></figure><figure><div class="ph"><img src="shots/L7-open.jpg"><span class="n">11</span></div><figcaption><b>0:09.2</b> 두 원이 모양 그대로 커지며 화면 밖으로</figcaption></figure><figure><div class="ph"><img src="shots/film-water.jpg"><span class="n">12</span></div><figcaption><b>0:09.6</b> AI 홍보영상 ① 맑은 물가 (영화 비율)</figcaption></figure><figure><div class="ph"><img src="shots/film-silk.jpg"><span class="n">13</span></div><figcaption><b>0:10.6</b> ② 세럼 물결</figcaption></figure><figure><div class="ph"><img src="shots/film-end.jpg"><span class="n">14</span></div><figcaption><b>0:11.6</b> ③ "Skin that breathes."</figcaption></figure><figure><div class="ph"><img src="shots/reel-soom.jpg"><span class="n">15</span></div><figcaption><b>0:12.6</b> 검은 띠가 열리면 — 새 쇼핑몰의 첫 화면</figcaption></figure><figure><div class="ph"><img src="shots/07-morning-phone.jpg"><span class="n">16</span></div><figcaption><b>0:14.6</b> 같은 자리의 아침: 새 주문 + "관리비 · 유지보수 · 호스팅 $0"</figcaption></figure></div><h2>실제 고객 — 같은 문법: 영화처럼 → 검은 띠가 열리면 그 회사 웹사이트 → 두 원이 지나가며 다음 고객</h2><div class="g"><figure><div class="ph"><img src="shots/cine-kvibe.jpg"><span class="n">17</span></div><figcaption><b>0:17</b> K-VIBE 실제 영상, 영화 비율</figcaption></figure><figure><div class="ph"><img src="shots/reel-kvibe.jpg"><span class="n">18</span></div><figcaption><b>0:17.8</b> 검은 띠가 열리면 K-VIBE 웹사이트</figcaption></figure><figure><div class="ph"><img src="shots/W1-kvibe-to-blooming.jpg"><span class="n">19</span></div><figcaption><b>0:18.4</b> 두 원이 렌즈처럼 가로지르며 다음 고객</figcaption></figure><figure><div class="ph"><img src="shots/cine-blooming.jpg"><span class="n">20</span></div><figcaption><b>0:18.7</b> Blooming 실제 영상</figcaption></figure><figure><div class="ph"><img src="shots/reel-blooming.jpg"><span class="n">21</span></div><figcaption><b>0:19.3</b> Blooming 웹사이트</figcaption></figure><figure><div class="ph"><img src="shots/W2-blooming-to-blessings.jpg"><span class="n">22</span></div><figcaption><b>0:19.8</b> 두 원이 반대 방향으로 지나감</figcaption></figure><figure><div class="ph"><img src="shots/cine-blessings.jpg"><span class="n">23</span></div><figcaption><b>0:20.1</b> Global Blessings 실제 영상</figcaption></figure><figure><div class="ph"><img src="shots/reel-blessings.jpg"><span class="n">24</span></div><figcaption><b>0:20.6</b> Global Blessings 웹사이트</figcaption></figure><figure><div class="ph"><img src="shots/W3-chemilife.jpg"><span class="n">25</span></div><figcaption><b>0:21</b> 점점 빨라지며 두 원 안에서 스치듯: Chemilife</figcaption></figure><figure><div class="ph"><img src="shots/W4-chillenq.jpg"><span class="n">26</span></div><figcaption><b>0:21.25</b> ChillenQ</figcaption></figure><figure><div class="ph"><img src="shots/W5-ddm.jpg"><span class="n">27</span></div><figcaption><b>0:21.5</b> 동대문</figcaption></figure></div><h2>끝 → 처음</h2><div class="g"><figure><div class="ph"><img src="shots/E1-close.jpg"><span class="n">28</span></div><figcaption><b>0:21.8</b> 두 원이 닫히며</figcaption></figure><figure><div class="ph"><img src="shots/E2-logo.jpg"><span class="n">29</span></div><figcaption><b>0:22.2</b> Pause Studio 로고(엔딩) → 어둠 → 첫 장면(밤)으로 무한 반복</figcaption></figure></div></body></html>
