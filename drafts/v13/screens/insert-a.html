<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#0E0E0F;color:#F3EADB;font-family:Pretendard,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.bg{position:absolute;inset:-60px;background:url(src/cake_hires.png) center/cover;filter:blur(60px) brightness(.32) saturate(.8)}
h2{position:absolute;left:0;right:0;top:120px;text-align:center;font:800 100px/1 Pretendard;letter-spacing:-.02em}h2 em{font-style:normal;color:#F0B47A}
.in{position:absolute;left:150px;top:330px;display:grid;grid-template-columns:230px;grid-template-rows:repeat(3,170px);gap:14px}
.in div{border-radius:16px;background-size:cover;background-position:center;filter:saturate(.8) contrast(.9) brightness(.95)}
.arr{position:absolute;left:430px;top:585px;width:140px;height:4px;background:#F3EADB}.arr:after{content:"";position:absolute;right:-4px;top:-12px;border:14px solid transparent;border-left:20px solid #F3EADB}
.fr{position:absolute;left:620px;top:330px;width:1150px;height:540px;border-radius:22px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.5)}.fr div{position:absolute;inset:0;background:url(src/cake_hires.png) 50% 45%/cover}
.fr .scan{background:linear-gradient(90deg,transparent 0 64%,rgba(14,14,15,.6) 64%)}.fr .line{position:absolute;top:0;bottom:0;left:64%;width:3px;background:#F3EADB;box-shadow:0 0 30px 8px rgba(243,234,219,.6)}
.bar{position:absolute;left:620px;width:1150px;top:915px;display:flex;align-items:center;gap:26px;font:800 48px/1 Pretendard}.bar i{flex:1;height:10px;border-radius:5px;background:rgba(243,234,219,.18);position:relative}.bar i:after{content:"";position:absolute;left:0;top:0;bottom:0;width:72%;background:#F0B47A;border-radius:5px}
</style></head><body><div class="bg"></div>
<h2>사진 3장 → <em>AI 홍보영상</em></h2>
<div class="in"><div style="background-image:url(src/photo_5.png)"></div><div style="background-image:url(src/photo_1.png)"></div><div style="background-image:url(src/photo_9.png)"></div></div>
<div class="arr"></div>
<div class="fr"><div></div><div class="scan"></div><span class="line"></span></div>
<div class="bar">생성 중<i></i>72%</div>
</body></html>
