</style></head><body><h1>PAUSE STUDIO 첫 화면 영상 — 콘티 (약 23초, 무한 반복)</h1>
<p class="s">관리비에 지친 밤 → 일시정지 → 제품 사진 → PAUSE 로고 → 로고의 두 원 안에서 촬영 초점이 맞으며 광고 영상 → 새 쇼핑몰, 관리비 $0 → 실제 고객들 → 다시 밤</p>
<h2>밤 — 관리비에 지친 사장님</h2><div class="g"><figure><div class="ph"><img src="shots/01-night-shoulder.jpg"><span class="n">1</span></div><figcaption><b>0:00</b> 어두운 방, 낡은 쇼핑몰 앞의 SOOM 대표(가상 브랜드)<em>아주 느리게 다가감</em></figcaption></figure><figure><div class="ph"><img src="shots/02-night-phone.jpg"><span class="n">2</span></div><figcaption><b>0:02</b> 식탁 위 휴대폰: 주문 0건 · 초기 세팅비 $450 · 유지보수비 $50 · 관리비 $100 · 호스팅 $70<em>알림이 하나씩 튀어 오름</em></figcaption></figure><figure><div class="ph"><img src="shots/03-pause.jpg"><span class="n">3</span></div><figcaption><b>0:05</b> 화면이 "일시정지"되듯 멈추고 색이 빠짐</figcaption></figure></div><h2>PAUSE STUDIO — 로고에서 촬영 초점으로 (끊김 없이 한 번에)</h2><div class="g"><figure><div class="ph"><img src="shots/04-before.jpg"><span class="n">4</span></div><figcaption><b>0:05.8</b> 대표가 휴대폰으로 찍은 평범한 제품 사진</figcaption></figure><figure><div class="ph"><img src="shots/f1-logo-in.jpg"><span class="n">5</span></div><figcaption><b>0:06.4</b> 사진이 어둠으로 가라앉으며 로고가 떠오름</figcaption></figure><figure><div class="ph"><img src="shots/f2-logo.jpg"><span class="n">6</span></div><figcaption><b>0:07</b> Pause Studio 로고</figcaption></figure><figure><div class="ph"><img src="shots/f3-rings.jpg"><span class="n">7</span></div><figcaption><b>0:07.8</b> 글자만 사라지고 로고의 두 원은 그대로 — 그 안에 광고 영상이 초점이 나간 채 보임<em>원의 모양·크기 그대로</em></figcaption></figure><figure><div class="ph"><img src="shots/f4-focus.jpg"><span class="n">8</span></div><figcaption><b>0:08.4</b> 초점이 "딱" 맞음<em>포커스 당기기</em></figcaption></figure><figure><div class="ph"><img src="shots/f5-open.jpg"><span class="n">9</span></div><figcaption><b>0:08.9</b> 두 원이 모양 그대로 커지며 화면 밖으로<em>균일하게 확대</em></figcaption></figure><figure><div class="ph"><img src="shots/film-water.jpg"><span class="n">10</span></div><figcaption><b>0:09.4</b> AI 홍보영상 ① 맑은 물가<em>영화 비율 · 느린 밀기</em></figcaption></figure></div><h2>광고 영상과 새 쇼핑몰</h2><div class="g"><figure><div class="ph"><img src="shots/film-silk.jpg"><span class="n">11</span></div><figcaption><b>0:10.4</b> ② 세럼 물결</figcaption></figure><figure><div class="ph"><img src="shots/film-end.jpg"><span class="n">12</span></div><figcaption><b>0:11.4</b> ③ "Skin that breathes."</figcaption></figure><figure><div class="ph"><img src="shots/reel-soom.jpg"><span class="n">13</span></div><figcaption><b>0:12.4</b> 새 쇼핑몰, 첫 화면에서 그 영상이 재생<em>화면이 뒤로 빠짐</em></figcaption></figure><figure><div class="ph"><img src="shots/07-morning-phone.jpg"><span class="n">14</span></div><figcaption><b>0:14.4</b> 같은 자리의 아침: 새 주문 + "관리비 · 유지보수 · 호스팅 $0"<em>밤과 같은 구도</em></figcaption></figure></div><h2>실제 고객 — 화면 가득 → 뒤로 빠지면 그 회사 웹사이트</h2><div class="g"><figure><div class="ph"><img src="shots/full-kvibe.jpg"><span class="n">15</span></div><figcaption><b>0:16.8</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-kvibe.jpg"><span class="n">16</span></div><figcaption><b>0:17.4</b> K-VIBE</figcaption></figure><figure><div class="ph"><img src="shots/full-blooming.jpg"><span class="n">17</span></div><figcaption><b>0:17.9</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-blooming.jpg"><span class="n">18</span></div><figcaption><b>0:18.4</b> Blooming</figcaption></figure><figure><div class="ph"><img src="shots/full-blessings.jpg"><span class="n">19</span></div><figcaption><b>0:18.9</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-blessings.jpg"><span class="n">20</span></div><figcaption><b>0:19.4</b> Global Blessings</figcaption></figure><figure><div class="ph"><img src="shots/full-chemilife.jpg"><span class="n">21</span></div><figcaption><b>0:19.8</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-chemilife.jpg"><span class="n">22</span></div><figcaption><b>0:20.2</b> Chemilife</figcaption></figure><figure><div class="ph"><img src="shots/full-chillenq.jpg"><span class="n">23</span></div><figcaption><b>0:20.6</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-chillenq.jpg"><span class="n">24</span></div><figcaption><b>0:21</b> ChillenQ</figcaption></figure><figure><div class="ph"><img src="shots/full-ddm.jpg"><span class="n">25</span></div><figcaption><b>0:21.4</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-ddm.jpg"><span class="n">26</span></div><figcaption><b>0:21.8</b> 동대문</figcaption></figure></div><h2>끝 → 처음</h2><div class="g"><figure><div class="ph"><img src="shots/zz-fade.jpg"><span class="n">27</span></div><figcaption><b>0:22.4</b> 마지막 사이트가 어둡게 가라앉고 첫 장면(밤)으로 이어짐<em>무한 반복</em></figcaption></figure></div></body></html>
