<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Pause Studio 2차 시안 미리보기</title>
<style>html,body{margin:0;height:100%;background:#111;color:#eee;font:15px/1.4 sans-serif}
main{height:100%;display:flex;align-items:center;justify-content:center}img{max-width:100vw;max-height:calc(100vh - 48px);display:block}
nav{position:fixed;left:0;right:0;bottom:0;height:48px;display:flex;gap:6px;align-items:center;justify-content:center;background:#000}
button{background:#222;color:#eee;border:1px solid #444;padding:8px 14px;cursor:pointer}button.on{background:#FCEED8;color:#111}</style></head>
<body><main><img id="v" alt=""></main><nav id="n"></nav>
<script>
const D=[['01','두 개의 원'],['02','밤의 항구'],['03','작업 색인'],['04','두 개의 고리'],['05','간섭'],['board','비교 보드']];
let i=0;const v=document.getElementById('v'),n=document.getElementById('n');
function show(k){i=(k+D.length)%D.length;const [id,name]=D[i];v.src=id==='board'?'PAUSE_hero_drafts_v2_board.png':`composites/hero-${id}_1920x1080.png`;v.alt=name;
[...n.children].forEach((b,j)=>b.className=j===i?'on':'')}
D.forEach(([id,name],j)=>{const b=document.createElement('button');b.textContent=id==='board'?name:`${id} ${name}`;b.onclick=()=>show(j);n.appendChild(b)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});show(0);
</script></body></html>
