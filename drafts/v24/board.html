</style></head><body><h1>PAUSE STUDIO 첫 화면 영상 — 콘티 (약 24초, 무한 반복)</h1>
<p class="s">관리비에 지친 밤 → 일시정지 → 사진 속 병에 초점이 나갔다 맞으면 광고 영상 → 새 쇼핑몰, 관리비 $0 → 실제 고객들 → 엔딩 로고 → 다시 밤</p>
<h2>밤 — 관리비에 지친 사장님</h2><div class="g"><figure><div class="ph"><img src="shots/01-night-shoulder.jpg"><span class="n">1</span></div><figcaption><b>0:00</b> 어두운 방, 낡은 쇼핑몰 앞의 SOOM 대표(가상 브랜드)<em>아주 느리게 다가감</em></figcaption></figure><figure><div class="ph"><img src="shots/02-night-phone.jpg"><span class="n">2</span></div><figcaption><b>0:02</b> 식탁 위 휴대폰: 주문 0건 · 초기 세팅비 $450 · 유지보수비 $50 · 관리비 $100 · 호스팅 $70<em>알림이 하나씩 튀어 오름</em></figcaption></figure><figure><div class="ph"><img src="shots/03-pause.jpg"><span class="n">3</span></div><figcaption><b>0:05</b> 화면이 "일시정지"되듯 멈추고 색이 빠짐</figcaption></figure></div><h2>사진 한 장 → 광고 영상 (초점이 나갔다 맞는 매치컷)</h2><div class="g"><figure><div class="ph"><img src="shots/04-before.jpg"><span class="n">4</span></div><figcaption><b>0:05.8</b> 대표가 휴대폰으로 찍은 평범한 제품 사진</figcaption></figure><figure><div class="ph"><img src="shots/m1-push.jpg"><span class="n">5</span></div><figcaption><b>0:06.4</b> 카메라가 사진 속 병으로 천천히 다가감</figcaption></figure><figure><div class="ph"><img src="shots/m2-defocus.jpg"><span class="n">6</span></div><figcaption><b>0:07.2</b> 초점이 흐려짐</figcaption></figure><figure><div class="ph"><img src="shots/m3-refocus.jpg"><span class="n">7</span></div><figcaption><b>0:07.6</b> 초점이 돌아오는 사이, 배경이 바다로 바뀌어 있음<em>병은 같은 자리 · 같은 크기</em></figcaption></figure><figure><div class="ph"><img src="shots/m4-sharp.jpg"><span class="n">8</span></div><figcaption><b>0:08</b> 초점이 딱 맞음 — 광고 영상 속 같은 병</figcaption></figure><figure><div class="ph"><img src="shots/film-water.jpg"><span class="n">9</span></div><figcaption><b>0:08.6</b> 카메라가 뒤로 빠지며 영화 비율 광고 영상<em>위아래 검은 띠</em></figcaption></figure></div><h2>광고 영상과 새 쇼핑몰</h2><div class="g"><figure><div class="ph"><img src="shots/film-silk.jpg"><span class="n">10</span></div><figcaption><b>0:09.6</b> ② 세럼 물결</figcaption></figure><figure><div class="ph"><img src="shots/film-end.jpg"><span class="n">11</span></div><figcaption><b>0:10.6</b> ③ "Skin that breathes."</figcaption></figure><figure><div class="ph"><img src="shots/reel-soom.jpg"><span class="n">12</span></div><figcaption><b>0:11.6</b> 새 쇼핑몰, 첫 화면에서 그 영상이 재생<em>검은 띠가 열리며 화면이 뒤로 빠짐</em></figcaption></figure><figure><div class="ph"><img src="shots/07-morning-phone.jpg"><span class="n">13</span></div><figcaption><b>0:13.6</b> 같은 자리의 아침: 새 주문 + "관리비 · 유지보수 · 호스팅 $0"<em>밤과 같은 구도</em></figcaption></figure></div><h2>실제 고객 — 화면 가득 → 뒤로 빠지면 그 회사 웹사이트</h2><div class="g"><figure><div class="ph"><img src="shots/full-kvibe.jpg"><span class="n">14</span></div><figcaption><b>0:16</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-kvibe.jpg"><span class="n">15</span></div><figcaption><b>0:16.6</b> K-VIBE</figcaption></figure><figure><div class="ph"><img src="shots/full-blooming.jpg"><span class="n">16</span></div><figcaption><b>0:17.1</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-blooming.jpg"><span class="n">17</span></div><figcaption><b>0:17.6</b> Blooming</figcaption></figure><figure><div class="ph"><img src="shots/full-blessings.jpg"><span class="n">18</span></div><figcaption><b>0:18.1</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-blessings.jpg"><span class="n">19</span></div><figcaption><b>0:18.6</b> Global Blessings</figcaption></figure><figure><div class="ph"><img src="shots/full-chemilife.jpg"><span class="n">20</span></div><figcaption><b>0:19</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-chemilife.jpg"><span class="n">21</span></div><figcaption><b>0:19.4</b> Chemilife</figcaption></figure><figure><div class="ph"><img src="shots/full-chillenq.jpg"><span class="n">22</span></div><figcaption><b>0:19.8</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-chillenq.jpg"><span class="n">23</span></div><figcaption><b>0:20.2</b> ChillenQ</figcaption></figure><figure><div class="ph"><img src="shots/full-ddm.jpg"><span class="n">24</span></div><figcaption><b>0:20.6</b> </figcaption></figure><figure><div class="ph"><img src="shots/reel-ddm.jpg"><span class="n">25</span></div><figcaption><b>0:21</b> 동대문<em>점점 빨라지는 리듬</em></figcaption></figure></div><h2>끝 → 처음</h2><div class="g"><figure><div class="ph"><img src="shots/zz-fade.jpg"><span class="n">26</span></div><figcaption><b>0:21.6</b> 마지막 사이트가 어둡게 가라앉음</figcaption></figure><figure><div class="ph"><img src="shots/zz-logo.jpg"><span class="n">27</span></div><figcaption><b>0:22</b> Pause Studio 로고가 조용히 떠오름 (엔딩 타이틀)</figcaption></figure><figure><div class="ph"><img src="shots/01-night-shoulder.jpg"><span class="n">28</span></div><figcaption><b>0:24</b> 어둠 속에서 첫 장면이 다시 시작<em>무한 반복</em></figcaption></figure></div></body></html>
