<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;font-family:Pretendard,sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(135deg,#2B3442,#1A1F28)}
.mb{height:34px;background:rgba(20,22,26,.7);color:#E8E8EA;font:600 15px/34px Pretendard;padding:0 20px;display:flex;gap:26px}.mb .r{margin-left:auto;font-weight:500}
.win{position:absolute;left:40px;top:64px;right:40px;bottom:40px;background:#1C1D21;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);border:1px solid #2C2E33}
.tb{height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #000;color:#D9D9DD;font:600 15px/1 Pretendard}.tb i{width:13px;height:13px;border-radius:50%;background:#FF5F57;display:inline-block}.tb i+i{background:#FEBC2E}.tb i+i+i{background:#28C840}.tb b{margin-left:18px}
.side{position:absolute;left:0;top:52px;bottom:0;width:420px;border-right:1px solid #000;padding:22px;color:#BDBDC3}
h4{font:700 13px/1 Pretendard;letter-spacing:.08em;color:#8B8C93;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid div{aspect-ratio:1;border-radius:8px;background-size:cover;background-position:center}
.grid+p{font:500 13px/1.6 Pretendard;color:#8B8C93;margin-top:12px}
.main{position:absolute;left:420px;right:440px;top:52px;bottom:0;padding:24px}
.pair{display:flex;gap:18px;align-items:center}.pair figure{flex:1}.pair figure div{aspect-ratio:16/9;border-radius:10px;background-size:cover;background-position:center}
.pair figcaption{font:600 14px/1 Pretendard;color:#A9AAB0;margin-top:10px}.pair .ar{font:300 40px/1 Pretendard;color:#666}
.tl{margin-top:34px;height:230px;background:#151618;border-radius:10px;padding:18px;position:relative}
.trk{height:56px;border-radius:6px;margin-top:14px;background-size:auto 100%;background-repeat:repeat-x;border:1px solid rgba(255,255,255,.15)}
.ph{position:absolute;left:46%;top:10px;bottom:10px;width:2px;background:#FF453A}
.right{position:absolute;right:0;top:52px;bottom:0;width:440px;border-left:1px solid #000;padding:22px;display:flex;flex-direction:column;align-items:center}
.phone{width:300px;height:649px;border-radius:44px;background:#000;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}.phone img{width:100%;height:100%;border-radius:34px;display:block}
.nt{position:absolute;left:470px;top:86px;width:440px;background:rgba(246,246,248,.92);border-radius:18px;padding:16px 18px;display:flex;gap:14px;box-shadow:0 16px 40px rgba(0,0,0,.35);backdrop-filter:blur(20px)}
.nt .ic{width:44px;height:44px;border-radius:11px;background:url(src/photo_5.png) center/cover}.nt b{font:700 16px/1.3 Pretendard;color:#111;display:block}.nt span{font:500 15px/1.4 Pretendard;color:#333}.nt small{position:absolute;right:16px;top:16px;font:500 13px/1 Pretendard;color:#888}
</style></head><body>
<div class="mb"><span></span><span>Studio</span><span>파일</span><span>편집</span><span>보기</span><span class="r">오후 11:42</span></div>
<div class="win"><div class="tb"><i></i><i></i><i></i><b>Blooming — 홍보영상 · 웹사이트</b></div>
<div class="side"><h4>받은 사진</h4><div class="grid">
<div style="background-image:url(src/photo_5.png)"></div><div style="background-image:url(src/photo_1.png)"></div><div style="background-image:url(src/photo_9.png)"></div></div><p>사장님이 보낸 사진 3장</p>
<h4 style="margin-top:34px">다른 작업</h4><div class="grid">
<div style="background-image:url(src/cq_trailer.png)"></div><div style="background-image:url(src/ddm_gate.png)"></div><div style="background-image:url(src/kvibe_5.png)"></div></div></div>
<div class="main"><h4>사진 → 영상</h4><div class="pair">
<figure><div style="background-image:url(src/photo_5.png);filter:saturate(.9)"></div><figcaption>원본 사진</figcaption></figure><span class="ar">→</span>
<figure><div style="background:url(src/bloom_5.png) -560px -205px/1700px auto"></div><figcaption>홍보영상 · 0:08</figcaption></figure></div>
<div class="tl"><h4>타임라인</h4>
<div class="trk" style="background-image:url(src/photo_5.png)"></div>
<div class="trk" style="background-image:url(src/bloom_1.png);background-size:auto 100%"></div><div class="ph"></div></div></div>
<div class="right"><h4 style="align-self:flex-start">웹사이트 · 모바일</h4><div class="phone"><img src="src/site_blooming_mobile.png" alt=""></div></div></div>
<div class="nt"><div class="ic"></div><div><b>Blooming 사장님</b><span>사진 3장을 보냈습니다.</span></div><small>지금</small></div>
</body></html>
