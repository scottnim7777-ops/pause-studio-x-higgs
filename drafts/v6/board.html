</style></head><body><h1>PAUSE STUDIO — 6차 콘티: 연출 사진이 아니라 영화의 한 장면처럼</h1>
<p class="l">이야기: "가게는 매일 바쁘게 돌아가고, 사이트는 관리비 없이 그 옆에서 계속 일한다." 밤 → 아침 → 해 질 녘 → 비 오는 밤 → 다시 첫 장면으로 반복 (24초)<br>사람이 실제로 일하는 순간 · 손에 든 카메라 · 유리창 반사·빛 번짐·움직임 흐림 · 화면 속은 실제 제작 사이트 합성 · 장면당 1장만 생성</p>
<div class="g">
<figure><img src="shots/shot4-studio_kvibe.jpg"><figcaption><b>컷 1</b> 밤 · 디자인 스튜디오, 문틈으로 본 디자이너의 뒷모습<span>화면: K-VIBE — "여기서 만듭니다"</span></figcaption></figure>
<figure><img src="shots/shot1-bakery_blooming.jpg"><figcaption><b>컷 2</b> 이른 아침 · 케이크 가게 주방, 크림 짜는 손 옆에 세워 둔 iPhone<span>화면: Blooming 케이크 — 사장님이 바쁠 때도 사이트는 손님을 받는다</span></figcaption></figure>
<figure><img src="shots/shot3-street_dongdaemun.jpg"><figcaption><b>컷 3</b> 해 질 녘 · 횡단보도, 지나가던 사람이 휴대폰으로 식당을 찾음<span>화면: 동대문 한식당 모바일</span></figcaption></figure>
<figure><img src="shots/shot2-restaurant_dongdaemun.jpg"><figcaption><b>컷 4</b> 비 오는 밤 · 바로 그 식당, 의자를 올리는 사장님 · 창가의 MacBook<span>화면: 동대문 데스크톱 — 문 닫은 뒤에도 사이트는 켜져 있음 → "매달·매년 나가는 비용이 없는 웹사이트를 만듭니다." → 컷 1로 반복</span></figcaption></figure>
