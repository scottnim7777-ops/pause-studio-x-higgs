<p class="l">4차 피드백(칙칙하고 가난해 보임 · 노트북은 애플) 반영: 어두운 공간 → 햇빛 드는 고급 공간(오크·대리석·트래버틴·생화) · 기기는 Studio Display·MacBook Pro·iPhone<br>화면 속은 그대로 실제 제작 사이트를 합성 · 컷 5는 컷 1 책상의 오후→다음 날 아침빛으로 돌아와 끊김 없이 반복 · 영상은 이 느낌을 확인하신 뒤에만 만듭니다</p>
<h2>첫 화면 — 제목 서체 3안</h2><div class="g3"><figure><img src="composites/hero-A_1920x1080.png"><figcaption><b>A</b> SD 격동명조2 <span>힘 있는 제목, 영화 포스터 느낌</span></figcaption></figure><figure><img src="composites/hero-B_1920x1080.png"><figcaption><b>B</b> SD 정체 <span>붓맛이 살아 있는 문학적 명조</span></figcaption></figure><figure><img src="composites/hero-C_1920x1080.png"><figcaption><b>C</b> AG 최정호 <span>단정하고 고급스러운 정통 명조</span></figcaption></figure></div><h2>콘티 (24초 반복)</h2><div class="g4"><figure><img src="shots/shot1-studio_kvibe.jpg"><figcaption><b>컷 1</b> 0~5초 · 햇빛 드는 스튜디오 · Studio Display · 아침빛 → 한낮 <span>화면: K-VIBE(실제 영상 사이트)</span></figcaption></figure><figure><img src="shots/shot2-macro_dongdaemun.jpg"><figcaption><b>컷 2</b> 5~9초 · MacBook Pro 매크로 · 초점이 글자에서 사진으로 <span>화면: 동대문 한식당</span></figcaption></figure><figure><img src="shots/shot3-cafe_blooming.jpg"><figcaption><b>컷 3</b> 9~14초 · 파티스리 대리석 카운터 · iPhone · 늦은 아침빛 <span>화면: Blooming 케이크</span></figcaption></figure><figure><img src="shots/shot4-reception_blessings.jpg"><figcaption><b>컷 4</b> 14~19초 · 호텔식 라운지 리셉션 · MacBook Pro · 오후빛 <span>화면: Global Blessings 호스피스</span></figcaption></figure></div></body></html>
