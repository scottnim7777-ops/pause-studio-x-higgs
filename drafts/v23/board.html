</style></head><body><h1>PAUSE STUDIO 첫 화면 영상 — 콘티 (약 22초, 무한 반복)</h1>
<p class="s">관리비에 지친 밤 → 일시정지 → PAUSE 로고가 렌즈가 되어 사진 한 장을 광고 영상으로 → 새 쇼핑몰, 관리비 $0 → 실제 고객들 → 다시 밤</p>
<h2>밤 — 관리비에 지친 사장님</h2><div class="g"><figure><div class="ph"><img src="shots/01-night-shoulder.jpg"><span class="n">1</span></div><figcaption><b>0:00</b> 어두운 방, 낡은 쇼핑몰 앞의 SOOM 대표(가상 브랜드)<em>핸드헬드로 아주 느리게 다가감</em></figcaption></figure><figure><div class="ph"><img src="shots/02-night-phone.jpg"><span class="n">2</span></div><figcaption><b>0:02</b> 식탁 위 휴대폰에 알림이 쌓임: 주문 0건 · 초기 세팅비 $450 · 유지보수비 $50 · 관리비 $100 · 호스팅 $70<em>위에서 고정 · 알림이 하나씩 튀어 오름</em></figcaption></figure><figure><div class="ph"><img src="shots/03-pause.jpg"><span class="n">3</span></div><figcaption><b>0:05</b> 화면이 "일시정지"되듯 멈추고 색이 빠짐<em>정지</em></figcaption></figure></div><h2>PAUSE — 로고가 카메라 렌즈가 됨 (끊김 없이 한 번에)</h2><div class="g"><figure><div class="ph"><img src="shots/04-before.jpg"><span class="n">4</span></div><figcaption><b>0:05.8</b> 대표가 휴대폰으로 찍은 평범한 제품 사진</figcaption></figure><figure><div class="ph"><img src="shots/lens-1.jpg"><span class="n">5</span></div><figcaption><b>0:06.3</b> 사진이 어두워지며 로고의 선이 그려지기 시작</figcaption></figure><figure><div class="ph"><img src="shots/lens-2.jpg"><span class="n">6</span></div><figcaption><b>0:06.8</b> Pause Studio 로고 완성</figcaption></figure><figure><div class="ph"><img src="shots/lens-3.jpg"><span class="n">7</span></div><figcaption><b>0:07.4</b> 글자는 사라지고 두 원만 남아 렌즈처럼 커짐 · 원 안은 초점이 나감</figcaption></figure><figure><div class="ph"><img src="shots/lens-4.jpg"><span class="n">8</span></div><figcaption><b>0:08</b> 초점이 "딱" 맞는 순간 원 안은 광고 영상</figcaption></figure><figure><div class="ph"><img src="shots/lens-5.jpg"><span class="n">9</span></div><figcaption><b>0:08.5</b> 두 원이 화면 밖으로 열림</figcaption></figure></div><h2>광고 영상과 새 쇼핑몰</h2><div class="g"><figure><div class="ph"><img src="shots/film-water.jpg"><span class="n">10</span></div><figcaption><b>0:09</b> AI 홍보영상 ① 맑은 물가<em>영화 비율 · 느린 밀기</em></figcaption></figure><figure><div class="ph"><img src="shots/film-silk.jpg"><span class="n">11</span></div><figcaption><b>0:10</b> ② 세럼 물결<em>느린 평행 이동</em></figcaption></figure><figure><div class="ph"><img src="shots/film-end.jpg"><span class="n">12</span></div><figcaption><b>0:11</b> ③ "Skin that breathes."<em>그림자만 움직임</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-soom.jpg"><span class="n">13</span></div><figcaption><b>0:12</b> 새 쇼핑몰, 첫 화면에서 그 영상이 재생<em>검은 띠가 열리며 화면이 뒤로 빠짐</em></figcaption></figure><figure><div class="ph"><img src="shots/07-morning-phone.jpg"><span class="n">14</span></div><figcaption><b>0:14</b> 같은 자리의 아침: 새 주문 + "관리비 · 유지보수 · 호스팅 $0"<em>밤과 같은 구도</em></figcaption></figure></div><h2>실제 고객 — 화면 가득 → 뒤로 빠지면 그 회사 웹사이트</h2><div class="g"><figure><div class="ph"><img src="shots/full-kvibe.jpg"><span class="n">15</span></div><figcaption><b>0:16.5</b> K-VIBE 실제 영상이 화면 가득<em>천천히 다가감</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-kvibe.jpg"><span class="n">16</span></div><figcaption><b>0:17.1</b> 뒤로 빠지면 K-VIBE 사이트<em>다음 화면이 옆에서 밀고 들어옴</em></figcaption></figure><figure><div class="ph"><img src="shots/full-blooming.jpg"><span class="n">17</span></div><figcaption><b>0:17.6</b> Blooming 실제 영상</figcaption></figure><figure><div class="ph"><img src="shots/reel-blooming.jpg"><span class="n">18</span></div><figcaption><b>0:18.1</b> </figcaption></figure><figure><div class="ph"><img src="shots/full-blessings.jpg"><span class="n">19</span></div><figcaption><b>0:18.6</b> Global Blessings 실제 영상</figcaption></figure><figure><div class="ph"><img src="shots/reel-blessings.jpg"><span class="n">20</span></div><figcaption><b>0:19.1</b> </figcaption></figure><figure><div class="ph"><img src="shots/full-chemilife.jpg"><span class="n">21</span></div><figcaption><b>0:19.5</b> Chemilife 실제 배너</figcaption></figure><figure><div class="ph"><img src="shots/reel-chemilife.jpg"><span class="n">22</span></div><figcaption><b>0:19.9</b> </figcaption></figure><figure><div class="ph"><img src="shots/full-chillenq.jpg"><span class="n">23</span></div><figcaption><b>0:20.3</b> ChillenQ 실제 제품 사진</figcaption></figure><figure><div class="ph"><img src="shots/reel-chillenq.jpg"><span class="n">24</span></div><figcaption><b>0:20.7</b> </figcaption></figure><figure><div class="ph"><img src="shots/full-ddm.jpg"><span class="n">25</span></div><figcaption><b>0:21.1</b> 동대문 실제 사이트 그림</figcaption></figure><figure><div class="ph"><img src="shots/reel-ddm.jpg"><span class="n">26</span></div><figcaption><b>0:21.5</b> <em>점점 빨라지는 리듬</em></figcaption></figure></div><h2>끝 → 처음</h2><div class="g"><figure><div class="ph"><img src="shots/zz-fade.jpg"><span class="n">27</span></div><figcaption><b>0:22</b> 마지막 사이트가 어둡게 사라지며 첫 장면(밤)으로 이어짐<em>로고는 중간에 한 번만</em></figcaption></figure></div></body></html>
