<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#0E0E0F;color:#F3EADB;font-family:Pretendard,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:-60px;background:url(src/cake_hires.png) center/cover;filter:blur(60px) brightness(.35) saturate(.8)}
.top{position:absolute;left:96px;top:70px;display:flex;align-items:center;gap:14px;font:600 20px/1 Pretendard;letter-spacing:.04em;color:rgba(243,234,219,.8)}.top img{width:34px;height:34px;border-radius:9px}
.in{position:absolute;left:96px;top:250px;width:520px}.in h5,.out h5{font:600 16px/1 Pretendard;letter-spacing:.18em;color:rgba(243,234,219,.55);margin-bottom:18px}
.ph{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:300px 220px;gap:10px}.ph div{border-radius:14px;background-size:cover;background-position:center;filter:saturate(.85) contrast(.92) brightness(.97)}.ph div:first-child{grid-column:1/3}
.arr{position:absolute;left:660px;top:520px;width:150px;height:2px;background:linear-gradient(90deg,rgba(243,234,219,0),rgba(243,234,219,.8))}.arr:after{content:"";position:absolute;right:-2px;top:-7px;border:8px solid transparent;border-left:12px solid rgba(243,234,219,.8)}
.out{position:absolute;left:860px;top:250px;width:960px}
.fr{height:540px;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 40px 90px rgba(0,0,0,.5)}.fr div{position:absolute;inset:0;background:url(src/cake_hires.png) 50% 45%/cover}
.fr .scan{background:linear-gradient(90deg,transparent 0 62%,rgba(14,14,15,.62) 62%);inset:0}.fr .line{position:absolute;top:0;bottom:0;left:62%;width:2px;background:#F3EADB;box-shadow:0 0 24px 6px rgba(243,234,219,.55)}
.bar{display:flex;align-items:center;gap:18px;margin-top:22px;font:600 20px/1 Pretendard}.bar i{flex:1;height:4px;border-radius:2px;background:rgba(243,234,219,.15);position:relative}.bar i:after{content:"";position:absolute;left:0;top:0;bottom:0;width:72%;background:#F3EADB;border-radius:2px}
.bar span{color:rgba(243,234,219,.6);font-weight:500}
</style></head><body><div class="bg"></div>
<div class="top"><img src="src/ps_avatar.png" alt="">PAUSE STUDIO</div>
<div class="in"><h5>받은 사진 3장</h5><div class="ph"><div style="background-image:url(src/photo_5.png)"></div><div style="background-image:url(src/photo_1.png)"></div><div style="background-image:url(src/photo_9.png)"></div></div></div>
<div class="arr"></div>
<div class="out"><h5>AI 홍보영상</h5><div class="fr"><div></div><div class="scan"></div><span class="line"></span></div>
<div class="bar">생성 중<i></i>72%<span>· 0:08 · 4K</span></div></div>
</body></html>
