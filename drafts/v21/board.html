</style></head><body><h1>PAUSE STUDIO 첫 화면 영상 — 최종 설계 콘티 (약 24초, 무한 반복)</h1>
<p class="s">관리비에 지친 밤 → PAUSE → 사진 한 장이 광고 필름과 새 쇼핑몰로 → 같은 자리의 아침, 관리비 $0 → 실제 작업물 → 로고</p>
<p class="s2">원칙: 사람에게 화면을 들이밀지 않음 · 실제 고객 파트는 실제 화면만 · AI 영상은 물·빛·카메라 이동만 · SOOM은 가상 브랜드 · 설계서 docs/HERO_FILM_DESIGN.md</p>
<h2>시작</h2><div class="g"><figure><div class="ph"><img src="shots/00-logo.jpg"><span class="n">1</span></div><figcaption><b>0:00</b> 검은 화면, 흐릿하던 로고에 초점이 맞음<em>고정 · 초점 당기기</em></figcaption></figure><figure><div class="ph"><img src="shots/t-open.jpg"><span class="n">2</span></div><figcaption><b>0:01</b> 두 원이 렌즈 조리개처럼 열림<em>브랜드 시그니처</em></figcaption></figure></div><h2>고통 — 밤</h2><div class="g"><figure><div class="ph"><img src="shots/01-night-shoulder.jpg"><span class="n">3</span></div><figcaption><b>0:01.5</b> SOOM 대표 어깨 너머, 낡은 쇼핑몰과 쌓인 재고<em>핸드헬드로 아주 느리게 다가감</em></figcaption></figure><figure><div class="ph"><img src="shots/02-night-phone.jpg"><span class="n">4</span></div><figcaption><b>0:03.5</b> 식탁 위 휴대폰을 위에서. 주문 0건 · 초기 세팅비 $450 · 유지보수비 $50 · 관리비 $100 · 호스팅 $70<em>위에서 고정 · 알림이 하나씩 튀어 오름</em></figcaption></figure><figure><div class="ph"><img src="shots/t-pause.jpg"><span class="n">5</span></div><figcaption><b>0:06.5</b> 그 화면이 "일시정지" — 색이 빠지고 두 원이 지나감<em>PAUSE 시그니처 전환</em></figcaption></figure></div><h2>해결 — 사진 한 장이 광고와 쇼핑몰로</h2><div class="g"><figure><div class="ph"><img src="shots/04-before.jpg"><span class="n">6</span></div><figcaption><b>0:07.3</b> 대표가 휴대폰으로 찍은 제품 사진<em>고정 · 빛줄기가 쓸고 지나감</em></figcaption></figure><figure><div class="ph"><img src="shots/film-water.jpg"><span class="n">7</span></div><figcaption><b>0:08.2</b> AI 홍보영상 ① 맑은 물가<em>2.39:1 영화 비율 · 느린 밀기</em></figcaption></figure><figure><div class="ph"><img src="shots/film-silk.jpg"><span class="n">8</span></div><figcaption><b>0:09.3</b> ② 세럼 물결<em>느린 평행 이동</em></figcaption></figure><figure><div class="ph"><img src="shots/film-end.jpg"><span class="n">9</span></div><figcaption><b>0:10.3</b> ③ "Skin that breathes."<em>그림자만 천천히 움직임</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-soom.jpg"><span class="n">10</span></div><figcaption><b>0:11.4</b> 새 쇼핑몰 화면 녹화, 첫 화면에서 그 영상이 재생<em>검은 띠가 열림 · 스크롤</em></figcaption></figure><figure><div class="ph"><img src="shots/07-morning-phone.jpg"><span class="n">11</span></div><figcaption><b>0:13.4</b> 같은 자리의 아침: 새 주문이 쌓이고 "관리비 · 유지보수 · 호스팅 $0"<em>밤 장면과 같은 구도 매치컷</em></figcaption></figure></div><h2>실제 작업물 (실제 화면만)</h2><div class="g"><figure><div class="ph"><img src="shots/reel-kvibe.jpg"><span class="n">12</span></div><figcaption><b>0:16</b> K-VIBE<em>빠른 패닝 전환</em></figcaption></figure><figure><div class="ph"><img src="shots/reel-blooming.jpg"><span class="n">13</span></div><figcaption><b>0:17.2</b> Blooming Cake</figcaption></figure><figure><div class="ph"><img src="shots/reel-blessings.jpg"><span class="n">14</span></div><figcaption><b>0:18.3</b> Global Blessings</figcaption></figure><figure><div class="ph"><img src="shots/reel-chemilife.jpg"><span class="n">15</span></div><figcaption><b>0:19.3</b> Chemilife</figcaption></figure><figure><div class="ph"><img src="shots/reel-chillenq.jpg"><span class="n">16</span></div><figcaption><b>0:20.2</b> ChillenQ</figcaption></figure><figure><div class="ph"><img src="shots/reel-ddm.jpg"><span class="n">17</span></div><figcaption><b>0:21</b> 동대문<em>컷이 점점 짧아짐</em></figcaption></figure></div><h2>끝 = 처음</h2><div class="g"><figure><div class="ph"><img src="shots/t-end.jpg"><span class="n">18</span></div><figcaption><b>0:22</b> 마지막 화면이 멈추며 두 원이 그려짐<em>PAUSE 시그니처</em></figcaption></figure><figure><div class="ph"><img src="shots/00-logo.jpg"><span class="n">19</span></div><figcaption><b>0:24</b> 로고 = 첫 프레임 → 끝없이 반복</figcaption></figure></div></body></html>
